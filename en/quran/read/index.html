        $dataItems = Array("index", "start", "ayas", "name", "tname", "ename", "type", "order", "rukus",);

        $quranData = file_get_contents($metadataFile);

        xml_parse_into_struct($parser, $quranData, $values, $index);
        xml_parser_free($parser);

        }
    }
